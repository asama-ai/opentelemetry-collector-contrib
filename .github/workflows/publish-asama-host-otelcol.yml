# Asama-only. Builds asama-otel-collector (host ingest :4319). Does not replace asama-build.yml.
name: Publish asama-otel-collector

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-test[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Without v: 1.2.3 (production) or 1.2.3-test1 (testing)"
        required: true

permissions:
  contents: write
  packages: read

env:
  ARCH: amd64

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          upstream=$(awk '
            $1 == "contrib-base:" { in_base = 1; next }
            in_base && $1 == "version:" { print $2; exit }
          ' versions.yaml)
          upstream="${upstream#v}"
          if [[ ! "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: versions.yaml contrib-base version '$upstream' is not X.Y.Z"
            exit 1
          fi
          # Tag is the Asama version. Upstream stays versions.yaml unless that file changes.
          # vX.Y.Z-testN is matched before vX.Y.Z-test.
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-test([0-9]+)$ ]]; then
            asama="${BASH_REMATCH[1]}"
            rev="${asama}~test${BASH_REMATCH[2]}"
            echo "DEB_COMPONENT=test" >> "$GITHUB_ENV"
            echo "RPM_REPOSITORY=rpm-test" >> "$GITHUB_ENV"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-test$ ]]; then
            asama="${BASH_REMATCH[1]}"
            rev="${asama}~test"
            echo "DEB_COMPONENT=test" >> "$GITHUB_ENV"
            echo "RPM_REPOSITORY=rpm-test" >> "$GITHUB_ENV"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            asama="${BASH_REMATCH[1]}"
            rev="${asama}"
            echo "DEB_COMPONENT=main" >> "$GITHUB_ENV"
            echo "RPM_REPOSITORY=rpm" >> "$GITHUB_ENV"
          else
            echo "ERROR: tag '$tag' must be vX.Y.Z, vX.Y.Z-test, or vX.Y.Z-testN"
            echo "examples: v1.2.3  v0.141.0-test  v1.2.3-test1"
            exit 1
          fi
          # Debian: upstream - revision. '~testN' sorts older than the production revision.
          # RPM Version cannot contain '-'.
          echo "upstream=${upstream} asama=${asama} version=${upstream}-${rev}"
          echo "DEB_REPOSITORY=deb" >> "$GITHUB_ENV"
          echo "DEB_SUITE=generic" >> "$GITHUB_ENV"
          echo "DEB_VERSION=${upstream}-${rev}" >> "$GITHUB_ENV"
          echo "RPM_VERSION=${upstream}" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=${rev}" >> "$GITHUB_ENV"
          echo "DEB_PKG=deb/asama-otel-collector_${upstream}-${rev}_amd64.deb" >> "$GITHUB_ENV"
          echo "RPM_PKG=/home/runner/rpmbuild/RPMS/x86_64/asama-otel-collector_${upstream}-${rev}.x86_64.rpm" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install package tooling
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y rpm gnupg binutils jq

      - name: create build directory
        run: mkdir -p build/bin

      - name: Build host-agent OpenTelemetry Collector
        run: |
          set -euo pipefail
          make install-tools
          mkdir -p bin
          sed "s/ARCH_PLACEHOLDER/${ARCH}/g" asama-packaging/otel-collector/host-agent-otelcol-builder.yaml \
            > /tmp/host-agent-otelcol-builder-${ARCH}.yaml
          ./.tools/builder --config=/tmp/host-agent-otelcol-builder-${ARCH}.yaml
          mv "bin/otelcontribcol-otel-collector_linux_${ARCH}/otelcontribcol-otel-collector" build/bin/
          ./build/bin/otelcontribcol-otel-collector --help >/dev/null
          asama-packaging/scripts/asama_strip_otelcol.sh "${GITHUB_WORKSPACE}"

      - name: Prepare otel-collector DEB package
        run: |
          set -euo pipefail
          DEB_DIR="${DEB_PKG%.deb}"
          asama-packaging/deb/make-deb.sh "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          cp asama-packaging/deb/postinst "$DEB_DIR/DEBIAN/postinst"
          cp asama-packaging/deb/prerm "$DEB_DIR/DEBIAN/prerm"
          chmod 0755 "$DEB_DIR/DEBIAN/postinst" "$DEB_DIR/DEBIAN/prerm"
          sed "s/_VERSION_/${DEB_VERSION}/" asama-packaging/deb/control > "$DEB_DIR/DEBIAN/control"

      - name: Build otel-collector DEB
        run: |
          dpkg-deb --build "${DEB_PKG%.deb}"
          dpkg-deb -I "$DEB_PKG"

      - name: Prepare and build otel RPM
        run: |
          set -euo pipefail
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          cp build/bin/otelcontribcol-otel-collector ~/rpmbuild/SOURCES/
          cp asama-packaging/config/otel-collector-config.yaml ~/rpmbuild/SOURCES/
          cp asama-packaging/systemd/asama-otel-collector.service ~/rpmbuild/SOURCES/
          sed -e "s/_RPM_VERSION_/${RPM_VERSION}/" -e "s|_RPM_RELEASE_%{?dist}|${RPM_RELEASE}|" \
            asama-packaging/rpm/asama-otel-collector.spec > ~/rpmbuild/SPECS/asama-otel-collector.spec
          (cd ~/rpmbuild/SPECS && rpmbuild -ba asama-otel-collector.spec)
          rpm -qlp "$RPM_PKG"

      - name: Configure RPM signing
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          RPM_GPG_NAME: ${{ secrets.RPM_GPG_NAME || secrets.GPG_NAME }}
        run: |
          if [ -z "${RPM_GPG_PRIVATE_KEY:-}" ]; then
            echo "No RPM GPG key in this repo secrets; skip signing"
            exit 0
          fi
          asama-packaging/scripts/configure-rpm-signing.sh
          rpmsign --addsign "$RPM_PKG"
          sudo rpm --checksig "$RPM_PKG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asama-otel-collector-packages
          path: |
            ${{ env.DEB_PKG }}
            ${{ env.RPM_PKG }}

      - name: Upload packages to existing repositories
        env:
          ASAMA_REPO_USERNAME: ${{ secrets.ASAMA_REPO_USERNAME }}
          ASAMA_REPO_PASSWORD: ${{ secrets.ASAMA_REPO_PASSWORD }}
        run: |
          set -euo pipefail
          # deb, rpm, and rpm-test already exist. Upload, then publish.
          asama-packaging/scripts/repo-upload.sh deb "$DEB_REPOSITORY" "$DEB_PKG" "$DEB_SUITE" "$DEB_COMPONENT"
          asama-packaging/scripts/repo-upload.sh rpm "$RPM_REPOSITORY" "$RPM_PKG"

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DEB_PKG }}
            ${{ env.RPM_PKG }}
