# Example: collector-VM otel-collector config with inventorydiff.
# Copy the inventorydiff processor + metrics pipeline change into
# Deployment/otel/otel-collector.yaml on the collector VM.
#
# Requires a collector binary/image rebuilt from
# cmd/otel-collector/builder-config.yaml (inventorydiff compiled in).
# YAML alone is not enough if the running image lacks the processor.
#
# Do not commit real credentials. Set Authorization via env or a local override.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # redfishevent: ... (unchanged on the VM)

processors:
  inventorydiff:
    metrics:
      - node_md_member_info
    changelog:
      # Same platform OTLP hop that already feeds ClickHouse otel.logs
      endpoint: https://YOUR_PLATFORM_HOST/api/otel
      headers:
        Authorization: "Basic YOUR_BASE64_CREDENTIALS"

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlphttp:
    endpoint: https://YOUR_PLATFORM_HOST/api/otel
    headers:
      Authorization: "Basic YOUR_BASE64_CREDENTIALS"
    compression: gzip
    timeout: 30s

  prometheusremotewrite:
    endpoint: https://YOUR_PLATFORM_HOST/api/metrics/write
    headers:
      Authorization: "Basic YOUR_BASE64_CREDENTIALS"
    resource_to_telemetry_conversion:
      enabled: true
    timeout: 30s

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]

    metrics:
      receivers: [otlp]
      # Diff first, then batch, then VMetrics. Changelog is a side POST from inventorydiff.
      processors: [inventorydiff, batch]
      exporters: [prometheusremotewrite]
